[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "business_entity_resolution"
version = "1.0.0"
description = "Entity Resolution Pipeline for Amazon ML Challenge 2026"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "scikit-learn>=1.2.0",
    "scipy>=1.10.0",
    "lightgbm>=4.0.0",
    "rapidfuzz>=3.0.0",
    "pyyaml>=6.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "tokenizers>=0.13.0",
    "accelerate>=0.20.0",
    "tqdm>=4.65.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "mlflow>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]